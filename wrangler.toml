name = "mision-funcion"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Sitio estático (index.html, favicon, img/, _headers). Solo /api/* pasa primero por el Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Base de datos D1
[[d1_databases]]
binding = "DB"
database_name = "mision-funcion-db"
database_id = "PEGA-AQUI-EL-ID-DE-TU-BASE-D1"   # lo imprime: npx wrangler d1 create mision-funcion-db
